<!doctype html>
<html lang="es" class="app">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tu Faro</title>
  <meta name="description" content="Viento, marea y alertas del Canal Martín García">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1622" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono-192.png">
  <link rel="stylesheet" href="estilos.css">
  <script>
    // Modo noche antes de dibujar, para que no destelle la pantalla clara de noche.
    try { if (JSON.parse(localStorage.getItem("modo_noche"))) document.documentElement.dataset.tema = "noche"; } catch (e) {}
  </script>
</head>
<body>
  <div id="raiz"><p style="padding:16px">Cargando…</p></div>

  <dialog id="ajustes">
    <form method="dialog" id="form-ajustes">
      <h2>Ajustes</h2>
      <fieldset>
        <legend>Pantalla</legend>
        <label>Modo noche (todo en rojo) <input type="checkbox" name="noche"></label>
      </fieldset>
      <fieldset>
        <legend>Viento medio (nudos)</legend>
        <label>Amarillo desde <input type="number" step="0.1" name="vAmar"></label>
        <label>Naranja desde <input type="number" step="0.1" name="vNar"></label>
        <label>Rojo desde <input type="number" step="0.1" name="vRojo"></label>
      </fieldset>
      <fieldset>
        <legend>Ráfagas (nudos)</legend>
        <label>Amarillo desde <input type="number" step="0.1" name="gAmar"></label>
        <label>Rojo desde <input type="number" step="0.1" name="gRojo"></label>
      </fieldset>
      <fieldset>
        <legend>Altura del río (m, LIMB)</legend>
        <label>Mínimo <input type="number" step="0.01" name="rioMin" placeholder="sin cargar"></label>
        <p class="nota">Rojo por debajo del mínimo; amarillo hasta 0,2 m por encima; verde más arriba. Vacío: sin color.</p>
      </fieldset>
      <div class="botones">
        <button type="button" id="btn-defecto">Valores por defecto</button>
        <button value="cancelar">Cancelar</button>
        <button value="guardar" class="primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
